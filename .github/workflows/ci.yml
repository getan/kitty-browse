name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: true
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./cmd/kitty-browse
      # The library packages must keep compiling where the control socket does
      # not exist, because golder embeds them in its Windows build.
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build ./...
